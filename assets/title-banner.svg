<svg width="840" height="150" viewBox="0 0 840 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="accentLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0" />
      <stop offset="35%" stop-color="#E11D48" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#E11D48" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#E11D48" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="softAtmosphere" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#020306" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Seamless atmospheric glow -->
  <rect width="840" height="150" fill="url(#softAtmosphere)" />

  <!-- 1. Primary Name: MAYANK YENUGWAR (Natural, bold, premium display typography) -->
  <text x="420" y="58" text-anchor="middle" fill="url(#nameGradient)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', sans-serif" font-weight="800" font-size="38" letter-spacing="2.5">MAYANK YENUGWAR</text>

  <!-- 2. Role: ENGINEERING STUDENT // AI & SOFTWARE DEVELOPMENT -->
  <text x="420" y="92" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', sans-serif" font-weight="600" font-size="13" letter-spacing="3.5">ENGINEERING STUDENT  <tspan fill="#E11D48">//</tspan>  AI &amp; SOFTWARE DEVELOPMENT</text>

  <!-- 3. Tagline: Building at the edge of logic and imagination. -->
  <text x="420" y="118" text-anchor="middle" fill="#CBD5E1" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', sans-serif" font-weight="400" font-size="13" letter-spacing="1" font-style="italic">Building at the edge of logic and imagination.</text>

  <!-- 4. Subtle, minimal crimson accent rule -->
  <line x1="280" y1="136" x2="560" y2="136" stroke="url(#accentLineGrad)" stroke-width="1.5" />
  <circle cx="420" cy="136" r="2.5" fill="#E11D48" />
  <circle cx="420" cy="136" r="1" fill="#FFFFFF" />
</svg>
